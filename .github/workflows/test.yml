name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # 锁定与本地一致的版本，避免新版 forge fmt / lint 规则漂移导致 CI 失败
          version: "v1.7.1"

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        # ForkTest 依赖 MAINNET_RPC_URL secret；CI 不配置主网 RPC，故排除（本地有 .env 可全量跑）
        run: forge test -vvv --no-match-contract ForkTest
